name: HavenApp
options:
  bundleIdPrefix: app.haven
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  HavenCore:
    path: Packages/HavenCore
targets:
  HavenApp:
    type: application
    platform: iOS
    # Generate a *shared* scheme. Without this the only scheme is one Xcode autocreates into
    # xcuserdata, which `xcodegen generate` wipes — so `xcodebuild -scheme HavenApp` fails on a
    # fresh clone, in CI, or any time regeneration happens before the project is opened in Xcode.
    #
    # `testTargets` is what makes `xcodebuild test -scheme HavenApp` actually run the app-layer
    # suite. A test target that exists but is not in the scheme's test action is worse than no
    # target at all: `xcodebuild test` reports TEST SUCCEEDED having executed nothing, which is
    # precisely the silent-green failure this target exists to end.
    scheme:
      testTargets:
        - HavenAppTests
    sources: [App]
    dependencies:
      - package: HavenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haven.HavenApp
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Access WiFi Information — enabled now that the Apple Developer Program membership exists.
        # These two lines move together: the entitlement lets `NEHotspotNetwork.fetchCurrent()`
        # return an SSID at all, and `HAVEN_WIFI_INFO` is what the app code branches on. Without
        # the condition, the entitlement's absence is indistinguishable at runtime from "not on
        # Wi-Fi" — `fetchCurrent()` returns nil either way — so the settings screen would tell a
        # user sitting on Wi-Fi that they are not on Wi-Fi, and would offer a Location Services
        # prompt that could not possibly help.
        #
        # `com.apple.developer.networking.wifi-info` is *restricted*: it must also be enabled on
        # the App ID in Apple's developer portal. If a device build fails to sign, that portal
        # step is the thing to check — commenting both lines out again restores the previous
        # fully-correct behaviour, where the SSID is permanently unknown and home detection falls
        # through to the network path class and the 2s local probe
        # (docs/superpowers/specs/2026-07-26-havenapp-connection-model-design.md §4.1).
        CODE_SIGN_ENTITLEMENTS: App/Resources/HavenApp.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HAVEN_WIFI_INFO"

  # The app-layer test suite. Everything in `App/` — `AppModel`'s state machine, the routing that
  # decides which screen is on screen, the camera lifecycles — was previously unverifiable, and
  # three separate defects shipped through that gap with `swift test` green and `xcodebuild`
  # succeeding. HavenCore's own 508 tests cannot cover any of it: they run against a package that
  # knows nothing about SwiftUI, `AppModel` or `UserDefaults` as this app uses them.
  #
  # Hosted by the app (`TEST_HOST`/`BUNDLE_LOADER`) rather than a standalone logic bundle, because
  # the code under test *is* the app: `@testable import HavenApp` only links against an app target
  # that loads the tests into its own process. That is also why the suite must run on a simulator
  # destination — an iOS app cannot be hosted anywhere else.
  HavenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/HavenAppTests]
    dependencies:
      - target: HavenApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haven.HavenAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HavenApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HavenApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # HavenCore is linked once, by the app. Adding it here as well would put two copies of the
        # module in one process.
